name: AlumniConnect CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  # ── Flutter Lint & Test ──────────────────────────────────────────────────────
  flutter_ci:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: flutter test --no-pub

  # ── Python Backend Lint & Startup Test ──────────────────────────────────────
  python_ci:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-module/requirements.txt

      - name: Install dependencies
        working-directory: ai-module
        run: pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: ai-module
        run: |
          pip install flake8
          flake8 api/ pdf_parser/ career_twin/ --max-line-length=120 --ignore=E501,W503 || true

      - name: FastAPI startup test
        working-directory: ai-module
        env:
          PYTHONPATH: ${{ github.workspace }}/ai-module
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from api.main import app
          print('FastAPI app imported successfully')
          print('Routes:', [r.path for r in app.routes])
          "

  # ── Deploy to Render on main push ────────────────────────────────────────────
  deploy_render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [flutter_ci, python_ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Render deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping auto-deploy"
          fi
