services:
  - type: web
    name: alumniconnect-ai
    runtime: python
    rootDir: ai-module
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import sys; print(f'Python {sys.version}')" && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: PYTHONPATH
        value: /opt/render/project/src/ai-module:/opt/render/project/src/alumini_skill/alumini_skill:/opt/render/project/src/ai-module mentor match
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
    plan: free
