name: Alumniconnect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^17.2.2
  table_calendar: ^3.0.9
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  image_cropper: ^8.1.0
  file_picker: ^8.0.0
  shimmer: ^3.0.0
  supabase_flutter: ^2.5.6
  provider: ^6.1.2
  appwrite: ^21.0.0
  http: ^1.6.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
